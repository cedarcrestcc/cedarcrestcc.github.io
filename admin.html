<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://cedarcrestcc.ca/favicon.ico">
  <title>Event Registrations - Admin Dashboard</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-light: #dbeafe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 900px;
    }

    /* Header styling */
    .dashboard-header {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: white;
      padding: 2rem;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.2);
    }

    .dashboard-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .dashboard-header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .refresh-btn {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }

    .error-banner {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    /* Event Metrics Section (SVG Gauges) */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .event-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .event-metric-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .event-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    /* Semicircle Gauge SVG */
    .gauge-wrapper {
      position: relative;
      width: 180px;
      height: 100px;
      margin-bottom: 0.75rem;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gauge-percentage {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .gauge-stats {
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .stat-box span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .stat-box strong {
      font-size: 1rem;
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Header -->
    <div class="dashboard-header">
      <div>
        <h1>Internal Recollections Dashboard</h1>
        <p>Live registration capacity and fill rate tracking</p>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadDashboardData()">Refresh Data</button>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <!-- Event Specific Gauge Tracking -->
    <div class="section-title">Capacity &amp; Fill Rate by Event</div>
    <div class="event-metrics-grid" id="eventMetricsContainer"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyV0SxDy6jUogcixytnv8hboXKARogbucenzVRsbYUND_XvOnlPdc4H5LLsYzwcWnxD/exec';

    const eventDefinitions = {
      'event-1': { title: 'WH - TUE December 1, 2026', limit: 26 },
      'event-2': { title: 'WH - WED December 2, 2026', limit: 26 },
      'event-3': { title: 'EC - WED December 2, 2026', limit: 50 }
    };

    let currentCounts = {};

    async function loadDashboardData() {
      const refreshBtn = document.getElementById('refreshBtn');
      const errorBanner = document.getElementById('errorBanner');
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Refreshing...';
      errorBanner.style.display = 'none';

      try {
        const response = await fetch(SCRIPT_URL + '?action=getCounts');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        currentCounts = data.counts || {};

        // Fallback: calculate counts from registrants array if counts object is empty
        if (Object.keys(currentCounts).length === 0 && Array.isArray(data.registrants)) {
          data.registrants.forEach(item => {
            const evtId = item.eventId || item.event_id || '';
            if (evtId) {
              currentCounts[evtId] = (currentCounts[evtId] || 0) + 1;
            }
          });
        }

      } catch (err) {
        console.error('Failed to load dashboard data:', err);
        errorBanner.textContent = 'Unable to connect to live data source. Check your Google Apps Script deployment permissions ("Anyone").';
        errorBanner.style.display = 'block';
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh Data';
      }

      renderEventMetrics();
    }

    function renderEventMetrics() {
      const container = document.getElementById('eventMetricsContainer');
      container.innerHTML = '';

      const arcLength = Math.PI * 70;

      Object.keys(eventDefinitions).forEach(id => {
        const evt = eventDefinitions[id];
        const registeredCount = currentCounts[id] || 0;
        const remaining = Math.max(0, evt.limit - registeredCount);
        const percentage = Math.min(100, Math.round((registeredCount / evt.limit) * 100));
        const dashOffset = arcLength - (arcLength * (percentage / 100));

        let strokeColor = '#2563eb';
        if (percentage >= 90) strokeColor = '#ef4444';
        else if (percentage >= 70) strokeColor = '#f59e0b';
        else if (percentage > 0) strokeColor = '#10b981';

        const card = document.createElement('div');
        card.className = 'event-metric-card';
        card.innerHTML = `
          <div class="event-card-title">${evt.title}</div>
          <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 180 100">
              <!-- Background Track -->
              <path d="M 20 90 A 70 70 0 0 1 160 90" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
              <!-- Filled Progress Arc -->
              <path d="M 20 90 A 70 70 0 0 1 160 90" fill="none" stroke="${strokeColor}" stroke-width="14" stroke-linecap="round"
                    stroke-dasharray="${arcLength}" stroke-dashoffset="${dashOffset}" style="transition: stroke-dashoffset 0.6s ease;" />
            </svg>
            <div class="gauge-percentage">${percentage}%</div>
          </div>
          <div class="gauge-stats">
            <div class="stat-box">
              <span>Registered</span>
              <strong>${registeredCount} / ${evt.limit}</strong>
            </div>
            <div class="stat-box">
              <span>Remaining</span>
              <strong>${remaining} spots</strong>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadDashboardData();
  </script>

</body>
</html>
